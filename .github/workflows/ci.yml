name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend + agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mockmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mockmind/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          # Core LiveKit Agents only (no STT/TTS plugins) — enough to import the
          # interviewer agent for the follow-up-cap tests.
          pip install "livekit-agents~=1.5" pytest httpx
      # No Redis, network or API keys needed: tests use an in-memory fake Redis
      # and stub the LLM. Script-style tests that need real services only run
      # under __main__, so pytest just collects them.
      - name: Run tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mockmind/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mockmind/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_LIVEKIT_URL: wss://example.livekit.cloud
