name: Evals (manual)

# Runs the LLM eval harness (mockmind/evals) against the real Gemini API.
# Costs money and is nondeterministic, so it never runs automatically:
# Actions tab -> "Evals (manual)" -> Run workflow.
# Needs a repository secret named GOOGLE_API_KEY.

on:
  workflow_dispatch:
    inputs:
      persona:
        description: "Which personas to simulate ('coding' needs the Piston service below)"
        type: choice
        default: all
        options: [all, coding, strong, vague, prompt_injector, coder, buggy_coder]
      runs:
        description: "Runs per persona (a pass RATE is more meaningful than one run)"
        default: "3"
      min_pass_rate:
        description: "Fail the job if any persona's pass rate is below this (0-1)"
        default: "0.8"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # Sandboxed code execution for the coding personas. Piston builds its own
      # isolation around each run, hence --privileged (same as docker-compose.yml).
      piston:
        image: ghcr.io/engineer-man/piston
        ports: ["2000:2000"]
        options: --privileged --tmpfs /tmp:exec
    defaults:
      run:
        working-directory: mockmind
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PISTON_URL: http://localhost:2000
      # Inputs go through env vars (not inline ${{ }} in the script) so they can't inject shell.
      PERSONA: ${{ inputs.persona }}
      RUNS: ${{ inputs.runs }}
      MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
    steps:
      - name: Require GOOGLE_API_KEY
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Add a repository secret named GOOGLE_API_KEY (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mockmind/backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run evals
        run: python evals/run_eval.py --persona "$PERSONA" --runs "$RUNS" --concurrency 3 --min-pass-rate "$MIN_PASS_RATE"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: mockmind/evals/results/
          if-no-files-found: ignore
